<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form action="">
        <label for="first">Name: </label>
        <input type="text" id="first" required placeholder="Enter Name" name="User_name">
        <br>
        <br>
        <label for="second">Email:</label>
        <input type="email" id="second" name="user_email" placeholder="Enter email address">
        <br><br>
        <label for="third">Phone Number: </label>
        <input type="tel" id="third" name="User_mobile" placeholder="Enter mobile number " required>
        <br><br>
        <label for="forth">About your self:</label>
        <textarea name="User_discription" id="forth" placeholder="Enter about your self " rows="10" cols="50"></textarea>
        <br><br>
        <button type="submit">send</button>
    </form>
</body>
</html>
