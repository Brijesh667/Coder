<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table's</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <br>
    <form action="">
        <label for="Name">Your Name: </label>
        <input type="text" id="Name" name="User_name">
        <br><br>
        <label for="Email">Your Email: </label>
        <input type="email" id="Email" name="User_email">
        <br><br>
        <label for="Rate">Rate us: </label>
        <input type="radio" id="Rate" name="Feedback" value="1-star">
        <label for="Rate">1 Star</label>
        <input type="radio" id="Rate" name="Feedback" value="2-star">
        <label for="Rate">2 Star</label>
        <input type="radio" id="Rate" name="Feedback" value="3-star">
        <label for="Rate">3 Star</label>
        <input type="radio" id="Rate" name="Feedback" value="4-star">
        <label for="Rate">4 Star</label>
        <input type="radio" id="Rate" name="Feedback" value="5-star">
        <label for="Rate">5 Star</label>
        <br><br>
        <label for="Text_area">Comment </label>
        <textarea name="" id="Text_area"></textarea>
        <br><br>
        <button type="submit">Submit Feedback</button>


        


    </form>
    
</body>
</html>
