<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health details</title>
</head>
<body>
    <h1>Health Details Form</h1>
    <form action="">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="full_name">Full Name: </label>
            <input type="text" id="full_name" name="User_name" placeholder="Full name">
            <br><br>
            <label for="DB">Date Of Birth: </label>
            <input type="date" name="Date_of_birth" id="DB">
            <br><br>
            <label for="Gender">Gender: </label>
            <select name="Gender" id="Gender">
                <option disabled selected>---select Gender---</option>
                <option value="Male">Male</option>
                <option value="female">female</option>
                <option value="Other">Other</option>
            </select>
            <br><br> 
            <label for="Phone">Phone Number: </label>
            <input type="tel" name="Mobile Number" placeholder="10 digit Mobile Number" id="Phone">
        </fieldset>
            
        <fieldset>
            <legend>Medical History</legend>
            <label for="Blood_group">Blood Group: </label>
            <select name="Blood_group" id="Blood_group">
                <option>---Select Blood Group---</option>
                <option value="A+">A+</option>
                <option value="B+">B+</option>
                <option value="AB+">AB+</option>
                <option value="O+">O+</option>
                <option value="A-">A-</option>
                <option value="B-">B-</option>
                <option value="AB-">AB-</option>
                <option value="O-">O-</option>
            </select>
            <br><br>
            <label>Do you wear glasses or contact lenses?</label>
            <br>
            <input type="radio" name="wear_glases" id="yes">
            <label for="yes">Yes</label>
            <br>
            <input type="radio" name="wear_glases" id="No">
            <label for="No">No</label>
            <br><br>    
            <label for="text_area1">Pre-existing Conditions:</label>
            <br>
            <textarea name="Pre_existing_conditions" rows="4" cols="50" id="text_area1" placeholder="List any pre-existing medical conditions"></textarea>
            <br><br>
            <label for="Allegies:">Allergies:</label>
            <br>
            <input type="checkbox" name="Allegies" value="Pollen" id="all1">
            <label for="all1">Pollen</label>
            <br>
            <input type="checkbox" name="Allegies" value="Peanuts" id="all2">
            <label for="all2">Peanuts</label>
            <br>
            <input type="checkbox" name="Allegies"
            value="Latex" id="all3">
            <label for="all3">Latex</label>
            <br>
            <input type="checkbox" name="Allegies"
            value="None" id="all4">
            <label for="all4">None</label>
            <br><br>
            <label for="text_area2">Current Medications: </label>
            <br>
            <textarea name="" id="text_area2" rows="4" cols="50" placeholder="List any current medications"></textarea>

        </fieldset>

        <fieldset>
            <legend>Emergency Contact</legend>
            <label for="Emergency_name">Emergency Contact Name: </label>
            <input type="text" name="Emergency_name" id="Emergency_name" placeholder="Emergency Contact Name">
            <br><br>
            <label for="Emergency_Number">Emergency Contact Phone:</label>
            <input type="tel" name="Emergency_Number" id="Emergency_Number" placeholder="10-digit Number">
            <br><br>
            <label for="Relationship">Relationship To Emergency Contact: </label>
            <input type="text" name="Relationship_name" id="Relationship" placeholder="Your Name">
        </fieldset>
        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
