  <!DOCTYPE html>
<html>
<head>
  <style>
    table {
      border-collapse: collapse;
      width: 80%;
      margin: 20px auto;
      font-family: Arial, sans-serif;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #999;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #f8f8f8;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #e0f7fa;
    }
    caption {
      caption-side: top;
      padding: 10px;
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>

<table>
  <caption>Student Grades Table</caption>
  <tr>
    <th>Name</th>
    <th>Subject</th>
    <th>Marks</th>
    <th>Status</th>
  </tr>
  <tr>
    <td>Alice</td>
    <td>Math</td>
    <td>88</td>
    <td>Pass</td>
  </tr>
  <tr>
    <td>Bob</td>
    <td>Science</td>
    <td>75</td>
    <td>Pass</td>
  </tr>
  <tr>
    <td>Charlie</td>
    <td>History</td>
    <td>58</td>
    <td>Fail</td>
  </tr>
  <tr>
    <td>Diana</td>
    <td>English</td>
    <td>92</td>
    <td>Pass</td>
  </tr>
</table>

</body>
</html>
