<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <link rel="stylesheet" href="piano_style.css">
</head>
<body>
   <div class="container1">
    
     <div class="controlpannel">
        <div class="menu">
            <button class="button exit">Exit</button>
            <button class="button setting">Setting</button>
            <button class="button padel">Padel</button>
        </div>
        <div class="loopvolume">
            <div class="text1">-----------Loop Volume-----------</div>
            <button class="lvolp button">vol+</button>
            <button class="lvolm button">vol-</button>
        </div>
        <div class="display">
            <div class="dtone">
            <div class="d1">Select Loop</div>
            <button class="dbutton">Loop2</button>
            <button class="dbutton">Loop3</button>
            <button class="dbutton">Loop4</button>
            
        </div>
        <div class="dloop">
            <div class="d2">Select Tone</div>
            <button class="dbutton">Tone2</button>
            <button class="dbutton">Tone3</button>
            <button class="dbutton">Tone4</button>
        </div>
        </div>
        <div class="tonevolume">
             <div class="text2">-------------Tone Volume-----------</div>
            <button class="tvolp button">vol+</button>
            <button class="tvolm button">vol-</button>
        </div>
        <div class="loopchange">
            <div class="loop">-----------------------LOOP------------------------</div>
            <button class="button1">In1</button>
            <button class="button1">In2</button>
            <button class="button1">In3</button>
            <button class="button1">V1</button>
            <button class="button1">V2</button>
            <button class="button1">V3</button>
            <button class="button1">F1</button>
            <button class="button1">F2</button>
            <button class="button1">F3</button>
        </div>
        <div class="tonechange">
            <div class="tone">-----------TONE----------</div>
            <button class="button2">1</button>
            <button class="button2">2</button>
            <button class="button2">3</button>
            <button class="button2">4</button>
            <button class="button2">5</button>
            <button class="button2">6</button>
           
        </div>

        <div class="start">
            <button class="button_start">Start</button>
        </div>
     </div>

     <div class="container2">
       
        <div class=" cover"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="white"></div>
       
        <div class="black b1"></div>
        <div class="black b2"></div>
        <div class="black b3"></div>
        <div class="black b4"></div>
        <div class="black b5"></div>
        <div class="black b6"></div>
        <div class="black b7"></div>
        <div class="black b8"></div>
    </div>
   </div>
</body>
</html>
